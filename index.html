<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUSAII — Quantum Legal Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,700&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════
   RESET & TOKENS
══════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --void:#020510;
  --abyss:#040918;
  --deep:#070d1f;
  --surface:#0a1228;
  --glass:rgba(10,18,40,0.7);
  --blue:#2563eb;
  --blue-bright:#3b82f6;
  --blue-glow:rgba(37,99,235,0.35);
  --gold:#d97706;
  --gold-bright:#f59e0b;
  --gold-glow:rgba(245,158,11,0.2);
  --ice:#e2e8f0;
  --mist:rgba(226,232,240,0.5);
  --ghost:rgba(226,232,240,0.08);
  --green:#10b981;
  --red:#ef4444;
  --amber:#f59e0b;
  --border:rgba(59,130,246,0.12);
  --border-gold:rgba(245,158,11,0.2);
  --font-serif:'Cormorant Garamond',serif;
  --font-sans:'Syne',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
html{scroll-behavior:smooth;}
body{
  background:var(--void);
  color:var(--ice);
  font-family:var(--font-sans);
  min-height:100vh;
  overflow-x:hidden;
  cursor:default;
}
::selection{background:var(--blue);color:#fff;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--blue);border-radius:2px;}

/* ══════════════════════════════════════════════
   CANVAS BACKGROUND
══════════════════════════════════════════════ */
#bg-canvas{
  position:fixed;inset:0;z-index:0;
  pointer-events:none;
}
.noise-overlay{
  position:fixed;inset:0;z-index:1;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events:none;opacity:.5;
}
.gradient-orb{
  position:fixed;border-radius:50%;filter:blur(120px);
  pointer-events:none;z-index:0;
}
.orb-1{width:600px;height:600px;background:radial-gradient(circle,rgba(37,99,235,0.15),transparent 70%);top:-200px;left:-100px;}
.orb-2{width:500px;height:500px;background:radial-gradient(circle,rgba(217,119,6,0.08),transparent 70%);bottom:-100px;right:-100px;}
.orb-3{width:400px;height:400px;background:radial-gradient(circle,rgba(37,99,235,0.1),transparent 70%);top:40%;left:60%;}

/* ══════════════════════════════════════════════
   LAYOUT
══════════════════════════════════════════════ */
#app{
  position:relative;z-index:10;
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
  padding:0 20px 80px;
}

/* ══════════════════════════════════════════════
   HEADER
══════════════════════════════════════════════ */
header{
  width:100%;max-width:1100px;
  display:flex;justify-content:space-between;align-items:center;
  padding:36px 0 32px;
  border-bottom:1px solid var(--border);
  position:relative;
}
header::after{
  content:'';position:absolute;bottom:-1px;left:0;
  width:120px;height:1px;
  background:linear-gradient(90deg,var(--blue),transparent);
}
.logo-block{display:flex;flex-direction:column;gap:4px;}
.logo{
  font-family:var(--font-serif);
  font-size:52px;font-weight:700;font-style:italic;
  letter-spacing:-2px;line-height:1;
  background:linear-gradient(135deg,#fff 0%,#93c5fd 50%,var(--blue) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  position:relative;
}
.logo-sub{
  font-size:9px;font-weight:700;
  letter-spacing:.55em;
  color:rgba(226,232,240,0.25);
  text-transform:uppercase;
  padding-left:3px;
}
.header-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:flex-end;}
.credit-badge{
  display:flex;align-items:baseline;gap:6px;
  padding:8px 18px;
  background:rgba(245,158,11,0.06);
  border:1px solid var(--border-gold);
  border-radius:100px;
  backdrop-filter:blur(10px);
}
.credit-label{font-size:9px;font-weight:700;letter-spacing:.12em;color:rgba(245,158,11,0.5);text-transform:uppercase;}
.credit-count{font-family:var(--font-serif);font-size:28px;font-weight:700;font-style:italic;color:var(--gold-bright);line-height:1;}
.user-email{font-size:11px;color:rgba(226,232,240,0.3);letter-spacing:.02em;}
.btn-auth{
  font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:9px 20px;border-radius:100px;border:none;cursor:pointer;
  transition:all .2s ease;
}
.btn-auth-login{background:var(--ghost);color:var(--ice);}
.btn-auth-login:hover{background:rgba(226,232,240,0.14);}
.btn-auth-register{background:var(--blue);color:#fff;}
.btn-auth-register:hover{background:var(--blue-bright);box-shadow:0 0 24px var(--blue-glow);}
.btn-auth-logout{background:rgba(239,68,68,0.1);color:#fca5a5;border:1px solid rgba(239,68,68,0.2);}
.btn-auth-logout:hover{background:rgba(239,68,68,0.2);}

/* ══════════════════════════════════════════════
   MAIN AREA
══════════════════════════════════════════════ */
main{width:100%;max-width:1100px;margin-top:56px;display:flex;flex-direction:column;gap:28px;}

/* ══════════════════════════════════════════════
   INPUT PANEL
══════════════════════════════════════════════ */
.input-panel{
  position:relative;
  background:var(--glass);
  backdrop-filter:blur(32px);
  border-radius:28px;
  border:1px solid var(--border);
  overflow:hidden;
  transition:border-color .3s;
}
.input-panel.focused{border-color:rgba(59,130,246,0.35);}
.input-panel-glow{
  position:absolute;inset:0;border-radius:28px;
  background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(37,99,235,0.08),transparent);
  pointer-events:none;
}
.corner-mark{
  position:absolute;width:20px;height:20px;
  border-color:rgba(59,130,246,0.3);border-style:solid;
  border-width:0;
}
.corner-mark.tl{top:12px;left:12px;border-top-width:1px;border-left-width:1px;border-top-left-radius:4px;}
.corner-mark.tr{top:12px;right:12px;border-top-width:1px;border-right-width:1px;border-top-right-radius:4px;}
.corner-mark.bl{bottom:12px;left:12px;border-bottom-width:1px;border-left-width:1px;border-bottom-left-radius:4px;}
.corner-mark.br{bottom:12px;right:12px;border-bottom-width:1px;border-right-width:1px;border-bottom-right-radius:4px;}
textarea#txt{
  width:100%;min-height:220px;max-height:400px;
  padding:40px 44px 32px;
  background:transparent;border:none;outline:none;
  font-family:var(--font-serif);
  font-size:18px;line-height:1.75;
  color:var(--ice);
  resize:vertical;
}
textarea#txt::placeholder{color:rgba(226,232,240,0.18);font-style:italic;}
.input-footer{
  display:flex;justify-content:space-between;align-items:center;
  padding:20px 28px 24px;
  border-top:1px solid var(--border);
  flex-wrap:wrap;gap:16px;
}
.status-cluster{display:flex;align-items:center;gap:10px;}
.status-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--green);
  box-shadow:0 0 8px var(--green);
  animation:pulseDot 2s ease-in-out infinite;
}
.status-dot.loading{background:var(--blue-bright);box-shadow:0 0 8px var(--blue-bright);}
.status-dot.error{background:var(--red);box-shadow:0 0 8px var(--red);animation:none;}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.85);}}
.status-text{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:rgba(226,232,240,0.3);}
.btn-cluster{display:flex;gap:10px;flex-wrap:wrap;}
.btn-action{
  position:relative;overflow:hidden;
  font-family:var(--font-sans);
  font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  padding:12px 22px;border-radius:100px;border:none;cursor:pointer;
  transition:all .25s ease;
  display:flex;align-items:center;gap:7px;
}
.btn-action::before{
  content:'';position:absolute;inset:0;
  background:rgba(255,255,255,0);
  transition:background .2s;
}
.btn-action:hover::before{background:rgba(255,255,255,0.06);}
.btn-action:disabled{opacity:.35;cursor:not-allowed;}
.btn-free{background:rgba(59,130,246,0.12);color:var(--blue-bright);border:1px solid rgba(59,130,246,0.25);}
.btn-free:hover:not(:disabled){border-color:rgba(59,130,246,0.5);box-shadow:0 0 20px rgba(59,130,246,0.12);}
.btn-premium{background:linear-gradient(135deg,rgba(245,158,11,0.2),rgba(217,119,6,0.12));color:var(--gold-bright);border:1px solid var(--border-gold);}
.btn-premium:hover:not(:disabled){border-color:rgba(245,158,11,0.45);box-shadow:0 0 24px var(--gold-glow);}
.btn-buy{background:linear-gradient(135deg,rgba(16,185,129,0.15),rgba(5,150,105,0.08));color:#34d399;border:1px solid rgba(16,185,129,0.2);}
.btn-buy:hover{border-color:rgba(16,185,129,0.4);box-shadow:0 0 20px rgba(16,185,129,0.1);}

/* ══════════════════════════════════════════════
   TRIBUNAL BADGE
══════════════════════════════════════════════ */
.tribunal-bar{
  display:flex;align-items:center;gap:12px;
  padding:12px 24px;
  background:rgba(245,158,11,0.05);
  border:1px solid var(--border-gold);
  border-radius:14px;
  font-size:11px;font-weight:600;
  color:rgba(245,158,11,0.7);
  letter-spacing:.08em;
  animation:fadeUp .4s ease-out;
}
.tribunal-icon{font-size:16px;}
.tribunal-name{color:var(--gold-bright);font-weight:800;}

/* ══════════════════════════════════════════════
   SINGULARITY LOG
══════════════════════════════════════════════ */
.log-panel{
  background:rgba(4,9,24,0.9);
  border:1px solid var(--border);
  border-radius:20px;
  overflow:hidden;
  display:none;
}
.log-panel.active{display:block;animation:fadeUp .35s ease-out;}
.log-header{
  display:flex;align-items:center;gap:12px;
  padding:14px 20px;
  border-bottom:1px solid var(--border);
  background:rgba(37,99,235,0.04);
}
.log-title-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--blue-bright);
  box-shadow:0 0 8px var(--blue-bright);
  animation:pulseDot 1.5s ease-in-out infinite;
}
.log-title{font-size:9px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:rgba(59,130,246,0.6);}
.log-progress-text{margin-left:auto;font-size:10px;font-family:var(--font-mono);color:rgba(226,232,240,0.3);}
.progress-track{height:2px;background:rgba(59,130,246,0.1);position:relative;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--blue-bright));width:0%;transition:width .5s ease;position:relative;}
.progress-fill::after{content:'';position:absolute;right:0;top:-1px;width:4px;height:4px;background:var(--blue-bright);border-radius:50%;box-shadow:0 0 6px var(--blue-bright);}
#log-feed{
  padding:16px 20px;
  max-height:280px;
  overflow-y:auto;
  display:flex;flex-direction:column;gap:3px;
}
.log-line{
  font-family:var(--font-mono);
  font-size:11px;line-height:1.6;
  display:flex;gap:10px;align-items:flex-start;
  padding:2px 0;
  border-bottom:1px solid rgba(255,255,255,0.02);
  animation:logIn .2s ease-out;
}
@keyframes logIn{from{opacity:0;transform:translateX(-6px);}to{opacity:1;transform:translateX(0);}}
.log-ts{color:rgba(226,232,240,0.18);flex-shrink:0;font-size:10px;}
.log-msg{flex:1;}
.log-thinking .log-msg{color:#60a5fa;}
.log-done .log-msg{color:#34d399;}
.log-skip .log-msg{color:#334155;}
.log-veto .log-msg{color:#fca5a5;font-weight:500;}
.log-judge .log-msg{color:#fbbf24;}
.log-score .log-msg{color:#a78bfa;}
.log-warmup .log-msg{color:#64748b;font-style:italic;}
.log-verdict .log-msg{color:#c4b5fd;}

/* ══════════════════════════════════════════════
   SCORE RING
══════════════════════════════════════════════ */
.score-panel{
  display:flex;align-items:center;gap:36px;
  padding:32px 40px;
  background:var(--glass);
  border:1px solid var(--border);
  border-radius:24px;
  backdrop-filter:blur(20px);
  animation:fadeUp .45s ease-out;
}
.score-ring-wrap{position:relative;width:120px;height:120px;flex-shrink:0;}
.score-svg{width:120px;height:120px;transform:rotate(-90deg);}
.score-track{fill:none;stroke:rgba(37,99,235,0.1);stroke-width:6;}
.score-arc{
  fill:none;stroke-width:6;stroke-linecap:round;
  stroke-dasharray:314;stroke-dashoffset:314;
  transition:stroke-dashoffset 1.8s cubic-bezier(.25,.46,.45,.94);
}
.score-center{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.score-num{
  font-family:var(--font-serif);
  font-size:36px;font-weight:700;font-style:italic;
  line-height:1;
  background:linear-gradient(135deg,#fff,var(--gold-bright));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.score-label-ring{font-size:8px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(226,232,240,0.3);margin-top:2px;}
.score-meta{flex:1;}
.score-meta-title{
  font-family:var(--font-serif);
  font-size:22px;font-weight:600;
  color:var(--ice);margin-bottom:8px;
}
.score-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.chip{
  font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:5px 12px;border-radius:100px;
}
.chip-green{background:rgba(16,185,129,0.12);color:#34d399;border:1px solid rgba(16,185,129,0.2);}
.chip-amber{background:rgba(245,158,11,0.12);color:#fbbf24;border:1px solid rgba(245,158,11,0.2);}
.chip-red{background:rgba(239,68,68,0.12);color:#fca5a5;border:1px solid rgba(239,68,68,0.2);}
.chip-blue{background:rgba(59,130,246,0.12);color:#93c5fd;border:1px solid rgba(59,130,246,0.2);}
.chip-muted{background:rgba(226,232,240,0.05);color:rgba(226,232,240,0.4);border:1px solid rgba(226,232,240,0.08);}
.score-desc{font-size:13px;line-height:1.65;color:rgba(226,232,240,0.55);}

/* ══════════════════════════════════════════════
   VERDICT CARD
══════════════════════════════════════════════ */
.verdict-card{
  position:relative;overflow:hidden;
  border-radius:24px;
  padding:40px 44px;
  backdrop-filter:blur(20px);
  animation:verdictReveal .6s cubic-bezier(.16,1,.3,1);
}
@keyframes verdictReveal{
  from{opacity:0;transform:translateY(20px) scale(.98);}
  to{opacity:1;transform:translateY(0) scale(1);}
}
.verdict-card.favorable{
  background:linear-gradient(145deg,rgba(37,99,235,0.14),rgba(7,13,31,0.9));
  border:1px solid rgba(59,130,246,0.25);
}
.verdict-card.favorable::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,var(--blue),transparent);
}
.verdict-card.veto{
  background:linear-gradient(145deg,rgba(239,68,68,0.14),rgba(7,13,31,0.9));
  border:1px solid rgba(239,68,68,0.25);
}
.verdict-card.veto::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,var(--red),transparent);
}
.verdict-header{
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:16px;margin-bottom:28px;
}
.verdict-title-group{display:flex;align-items:center;gap:14px;}
.verdict-icon{font-size:28px;line-height:1;}
.verdict-title{
  font-family:var(--font-serif);
  font-size:26px;font-weight:700;font-style:italic;
  color:var(--ice);letter-spacing:-.5px;
}
.verdict-subtitle{
  font-size:10px;font-weight:700;letter-spacing:.2em;
  text-transform:uppercase;color:rgba(226,232,240,0.3);
  margin-top:2px;
}
.btn-pdf{
  font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:10px 20px;border-radius:100px;border:none;cursor:pointer;
  background:rgba(16,185,129,0.12);
  color:#34d399;
  border:1px solid rgba(16,185,129,0.25);
  transition:all .2s;
  display:flex;align-items:center;gap:7px;
}
.btn-pdf:hover{background:rgba(16,185,129,0.2);border-color:rgba(16,185,129,0.5);}
.verdict-divider{
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(226,232,240,0.1) 20%,rgba(226,232,240,0.1) 80%,transparent);
  margin:24px 0;
}
.verdict-text{
  font-family:var(--font-serif);
  font-size:16px;line-height:2;
  color:rgba(226,232,240,0.85);
  white-space:pre-wrap;
}

/* ══════════════════════════════════════════════
   AGENT GRID
══════════════════════════════════════════════ */
.agents-section{animation:fadeUp .5s ease-out .1s both;}
.agents-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:20px;
}
.section-title{
  font-size:10px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;
  color:rgba(226,232,240,0.25);
}
.agents-count{
  font-family:var(--font-mono);
  font-size:11px;color:rgba(59,130,246,0.5);
}
.agents-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:12px;
}
.agent-card{
  background:rgba(10,18,40,0.7);
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  transition:border-color .2s,transform .2s;
  animation:fadeUp .4s ease-out both;
}
.agent-card:nth-child(n){animation-delay:calc(var(--i,0) * .04s);}
.agent-card:hover{border-color:rgba(59,130,246,0.25);transform:translateY(-2px);}
.agent-summary{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;
  cursor:pointer;
  user-select:none;
  transition:background .15s;
}
.agent-summary:hover{background:rgba(59,130,246,0.04);}
.agent-num{
  font-family:var(--font-mono);
  font-size:10px;font-weight:500;
  color:rgba(59,130,246,0.45);
  flex-shrink:0;width:22px;
}
.agent-name{
  flex:1;
  font-size:12px;font-weight:700;
  color:rgba(226,232,240,0.85);
  letter-spacing:.01em;
}
.agent-conf{
  font-family:var(--font-mono);
  font-size:10px;color:rgba(226,232,240,0.25);
  flex-shrink:0;
}
.conf-val{color:var(--gold-bright);font-weight:500;}
.risk-pill{
  font-size:8px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 9px;border-radius:100px;flex-shrink:0;
}
.risk-CRÍTICO{background:rgba(239,68,68,0.15);color:#fca5a5;border:1px solid rgba(239,68,68,0.3);}
.risk-ALTO{background:rgba(249,115,22,0.15);color:#fdba74;border:1px solid rgba(249,115,22,0.3);}
.risk-MÉDIO{background:rgba(245,158,11,0.12);color:#fcd34d;border:1px solid rgba(245,158,11,0.25);}
.risk-BAIXO{background:rgba(16,185,129,0.12);color:#86efac;border:1px solid rgba(16,185,129,0.25);}
.agent-chevron{color:rgba(226,232,240,0.2);font-size:10px;transition:transform .2s;flex-shrink:0;}
.agent-card.open .agent-chevron{transform:rotate(180deg);}
.agent-body{
  display:none;padding:0 16px 16px;
  border-top:1px solid var(--border);
}
.agent-card.open .agent-body{display:block;animation:fadeUp .2s ease-out;}
.agent-specialty{
  font-size:10px;font-style:italic;font-family:var(--font-serif);
  color:rgba(226,232,240,0.3);
  margin:12px 0 10px;
}
.agent-risk-detail{
  font-size:10px;font-family:var(--font-mono);
  color:rgba(239,68,68,0.6);

<script>
/* ──────────────────────────────────────────────
   CANVAS STARS
────────────────────────────────────────────── */
(function(){
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, stars = [], links = [];
  const N = 80;

  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  for(let i=0;i<N;i++){
    stars.push({
      x:Math.random()*window.innerWidth,
      y:Math.random()*window.innerHeight,
      r:Math.random()*.9+.2,
      vx:(Math.random()-.5)*.12,
      vy:(Math.random()-.5)*.12,
      o:Math.random()*.5+.1
    });
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    // Stars
    stars.forEach(s=>{
      s.x+=s.vx; s.y+=s.vy;
      if(s.x<0)s.x=W; if(s.x>W)s.x=0;
      if(s.y<0)s.y=H; if(s.y>H)s.y=0;
      ctx.beginPath();
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(148,163,184,${s.o})`;
      ctx.fill();
    });
    // Links
    for(let i=0;i<N;i++){
      for(let j=i+1;j<N;j++){
        const dx=stars[i].x-stars[j].x;
        const dy=stars[i].y-stars[j].y;
        const dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<140){
          ctx.beginPath();
          ctx.moveTo(stars[i].x,stars[i].y);
          ctx.lineTo(stars[j].x,stars[j].y);
          ctx.strokeStyle=`rgba(37,99,235,${.06*(1-dist/140)})`;
          ctx.lineWidth=.5;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

/* ──────────────────────────────────────────────
   CONSTANTS & STATE
────────────────────────────────────────────── */
const API = "https://jusaii-app.onrender.com";
let token = localStorage.getItem("token");
let userId = null;
let _agentDone = 0, _agentTotal = 0;

/* ──────────────────────────────────────────────
   UI UTILITIES
────────────────────────────────────────────── */
function setStatus(msg, state="idle"){
  const dot = document.getElementById("st-dot");
  const txt = document.getElementById("st-msg");
  txt.textContent = msg;
  dot.className = "status-dot" + (state==="loading"?" loading":state==="error"?" error":"");
}

function setLoading(on){
  document.getElementById("btn-free").disabled = on;
  document.getElementById("btn-premium").disabled = on;
  setStatus(on?"Processando...":"Swarm Online", on?"loading":"idle");
}

function updateUI(){
  if(token){
    document.getElementById("auth-buttons").classList.add("hidden");
    document.getElementById("logout-btn").classList.remove("hidden");
    fetch(API+"/api/auth/me",{headers:{Authorization:`Bearer ${token}`}})
      .then(r=>r.json())
      .then(d=>{
        document.getElementById("p-count").textContent = d.premium_credits ?? 0;
        const em = document.getElementById("user-email");
        em.textContent = d.email||"";
        em.classList.remove("hidden");
        userId = d.id;
        if(d.is_admin) document.getElementById("admin-fab").classList.add("visible");
      })
      .catch(()=>{ localStorage.removeItem("token"); token=null; updateUI(); });
  } else {
    document.getElementById("auth-buttons").classList.remove("hidden");
    document.getElementById("logout-btn").classList.add("hidden");
    document.getElementById("user-email").classList.add("hidden");
    document.getElementById("p-count").textContent = "—";
    document.getElementById("admin-fab").classList.remove("visible");
  }
}

/* ──────────────────────────────────────────────
   INPUT FOCUS EFFECT
────────────────────────────────────────────── */
document.getElementById("txt").addEventListener("focus",()=>{
  document.getElementById("input-panel").classList.add("focused");
});
document.getElementById("txt").addEventListener("blur",()=>{
  document.getElementById("input-panel").classList.remove("focused");
});

/* ──────────────────────────────────────────────
   LOG
────────────────────────────────────────────── */
function resetLog(){
  document.getElementById("log-feed").innerHTML="";
  document.getElementById("log-panel").classList.remove("active");
  document.getElementById("log-counter").textContent="";
  document.getElementById("log-progress").style.width="0%";
  document.getElementById("tribunal-bar").classList.add("hidden");
  _agentDone=0; _agentTotal=0;
}

function pushLog(msg, cls="log-thinking"){
  const panel = document.getElementById("log-panel");
  panel.classList.add("active");
  const feed = document.getElementById("log-feed");
  const ts = new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  const line = document.createElement("div");
  line.className = `log-line ${cls}`;
  line.innerHTML = `<span class="log-ts">${ts}</span><span class="log-msg">${esc(msg)}</span>`;
  feed.appendChild(line);
  feed.scrollTop = feed.scrollHeight;
}

function updateProgress(){
  const pct = _agentTotal>0 ? (_agentDone/_agentTotal)*100 : 0;
  document.getElementById("log-progress").style.width = pct+"%";
  document.getElementById("log-counter").textContent =
    _agentTotal>0 ? `${_agentDone} / ${_agentTotal} concluídos` : "";
}

/* ──────────────────────────────────────────────
   AUTH
────────────────────────────────────────────── */
async function login(){
  const email = document.getElementById("login-email").value.trim();
  const pw    = document.getElementById("login-pw").value;
  const errEl = document.getElementById("login-err");
  errEl.style.display="none";
  if(!email||!pw){ showModalErr(errEl,"Preencha email e senha."); return; }
  try{
    const res = await fetch(API+"/api/auth/login",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({email,password:pw}),
      signal:AbortSignal.timeout(20000)
    });
    const d = await res.json();
    if(res.ok){ token=d.token; localStorage.setItem("token",token); closeModals(); updateUI(); }
    else showModalErr(errEl, d.detail||"Credenciais inválidas");
  }catch{ showModalErr(errEl,"Erro de conexão."); }
}

async function register(){
  const email = document.getElementById("reg-email").value.trim();
  const pw    = document.getElementById("reg-pw").value;
  const errEl = document.getElementById("reg-err");
  errEl.style.display="none";
  if(!email||!pw){ showModalErr(errEl,"Preencha email e senha."); return; }
  try{
    const res = await fetch(API+"/api/auth/register",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({email,password:pw}),
      signal:AbortSignal.timeout(20000)
    });
    const d = await res.json();
    if(res.ok){
      closeModals(); showLogin();
      document.getElementById("login-email").value=email;
      pushLog("✓ Conta criada! Use suas credenciais para entrar.","log-done");
    } else showModalErr(errEl, d.detail||"Erro ao criar conta");
  }catch{ showModalErr(errEl,"Erro de conexão."); }
}

function logout(){
  localStorage.removeItem("token"); token=null; userId=null;
  document.getElementById("output").innerHTML="";
  resetLog(); updateUI();
}

/* ──────────────────────────────────────────────
   WARM-UP
────────────────────────────────────────────── */
async function warmUp(){
  try{
    setStatus("Verificando servidor...","loading");
    pushLog("⏳ Verificando disponibilidade do servidor...","log-warmup");
    await fetch(API+"/",{signal:AbortSignal.timeout(15000)});
    pushLog("✓ Servidor ativo. Iniciando análise...","log-warmup");
  }catch{
    pushLog("⚠ Servidor respondeu lentamente, prosseguindo...","log-warmup");
  }
}

/* ──────────────────────────────────────────────
   ANALISAR
────────────────────────────────────────────── */
async function analisar(tipo){
  const prompt = document.getElementById("txt").value.trim();
  if(!prompt||prompt.length<20){ alert("Descreva o caso com pelo menos 20 caracteres."); return; }
  if(tipo==="premium"&&!token){ alert("Faça login para usar o relatório premium."); showLogin(); return; }

  document.getElementById("output").innerHTML="";
  resetLog();
  setLoading(true);

  try{
    await warmUp();
    if(tipo==="free") await analisarFree(prompt);
    else await analisarPremiumSSE(prompt);
  }catch(err){
    const msg = err.name==="TimeoutError"
      ? "O servidor demorou muito para responder. Aguarde 30s e tente novamente."
      : (err.message||"Erro desconhecido");
    document.getElementById("output").innerHTML = `
      <div class="loader-card" style="border-color:rgba(239,68,68,0.2);">
        <div style="font-size:32px;margin-bottom:16px;">⚠</div>
        <div class="loader-text" style="color:#fca5a5;">${esc(msg)}</div>
        <div style="margin-top:10px;font-size:12px;color:rgba(226,232,240,0.3);">O Render pode levar até 60s para acordar — tente novamente.</div>
      </div>`;
    setStatus("Erro","error");
  }finally{
    setLoading(false);
  }
}

/* ──────────────────────────────────────────────
   FREE
────────────────────────────────────────────── */
async function analisarFree(prompt){
  setStatus("Consultando especialista...","loading");
  const out = document.getElementById("output");

/* ──────────────────────────────────────────────
   PREMIUM SSE
────────────────────────────────────────────── */
async function analisarPremiumSSE(prompt){
  const out = document.getElementById("output");
  out.innerHTML=`<div class="loader-card"><div class="loader-ring"></div><div class="loader-text">Conectando ao Swarm...</div></div>`;

  const results=[], verdicts={text:"",veto:false};
  let analysisId=null, jusaiiScore=0, tribunal="", state="";

  const res = await fetch(API+"/api/analyze/premium/stream",{
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":`Bearer ${token}`},
    body:JSON.stringify({prompt}),
    signal:AbortSignal.timeout(310000)
  });

  if(!res.ok){
    const e=await res.json().catch(()=>({}));
    if(res.status===402){
      out.innerHTML=`
        <div class="loader-card" style="border-color:rgba(245,158,11,0.2);">
          <div style="font-size:32px;margin-bottom:16px;">⚠</div>
          <div class="loader-text" style="color:#fcd34d;">Sem créditos premium</div>
          <div style="margin-top:16px;"><button class="btn-action btn-buy" onclick="comprar()" style="margin:0 auto;">Comprar — R$ 19,90</button></div>
        </div>`;
      return;
    }
    throw new Error(e.detail||`Erro ${res.status}`);
  }

  out.innerHTML=""; // clear loader when stream starts

  const reader=res.body.getReader();
  const dec=new TextDecoder();
  let buf="";

  while(true){
    const {done,value}=await reader.read();
    if(done) break;
    buf+=dec.decode(value,{stream:true});
    const lines=buf.split("\n"); buf=lines.pop();
    for(const line of lines){
      if(!line.startsWith("data:")) continue;
      const raw=line.slice(5).trim();
      if(raw==="[DONE]") break;
      let ev; try{ev=JSON.parse(raw);}catch{continue;}

      if(ev.type==="start"){
        _agentTotal=ev.total||16;
        if(ev.tribunal){
          tribunal=ev.tribunal;
          document.getElementById("tribunal-name").textContent=tribunal;
          document.getElementById("tribunal-bar").classList.remove("hidden");
        }
        pushLog(ev.message,"log-thinking");
        updateProgress();
      }
      else if(ev.type==="agent_thinking") pushLog(ev.message,"log-thinking");
      else if(ev.type==="agent_done"){
        _agentDone++; updateProgress();
        pushLog(ev.message,"log-done");
        results.push(ev);
      }
      else if(ev.type==="agent_skip") pushLog(ev.message,"log-skip");
      else if(ev.type==="veto"){
        pushLog(ev.message,"log-veto");
        results.push(ev);
        const vCard=document.createElement("div");
        vCard.className="verdict-card veto";
        vCard.innerHTML=`<div class="verdict-header"><div class="verdict-title-group"><span class="verdict-icon">🚨</span><div><div class="verdict-title">Veto Emitido</div><div class="verdict-subtitle">${esc(ev.area||"")}</div></div></div></div><div class="verdict-text">${esc(ev.veto_reason||"")}</div>`;
        out.prepend(vCard);
      }
      else if(ev.type==="devil_thinking") pushLog(ev.message,"log-judge");
      else if(ev.type==="devil_done")     pushLog(ev.message,"log-done");
      else if(ev.type==="judge_thinking") pushLog(ev.message,"log-judge");
      else if(ev.type==="score"){
        jusaiiScore=ev.jusaii_score||0;
        pushLog(`⬡ Jusaii Score calculado: ${jusaiiScore.toFixed(0)}/100`,"log-score");
      }
      else if(ev.type==="verdict"){
        verdicts.text=ev.verdict||"";
        verdicts.veto=ev.veto_triggered||false;
        if(ev.jusaii_score) jusaiiScore=ev.jusaii_score;
        pushLog("⚖ Veredito final gerado.","log-verdict");
      }
      else if(ev.type==="saved"){
        analysisId=ev.analysis_id;
        if(ev.jusaii_score) jusaiiScore=ev.jusaii_score;
        if(ev.tribunal) tribunal=ev.tribunal;
        updateUI();
      }
      else if(ev.type==="error") throw new Error(ev.message);
    }
  }

  if(verdicts.text) renderPremiumResult(verdicts.text,results,analysisId,verdicts.veto,jusaiiScore,tribunal,out);
}

/* ──────────────────────────────────────────────
   RENDER PREMIUM
────────────────────────────────────────────── */
function renderPremiumResult(verdict, results, analysisId, isVeto, score, tribunal, out){
  out.innerHTML="";

  // Score ring
  if(!isVeto && score>0){
    const scoreCard = buildScoreCard(score, tribunal, results.length);
    out.appendChild(scoreCard);
    // Animate arc after append
    setTimeout(()=>{
      const arc = scoreCard.querySelector(".score-arc");
      const pct = Math.min(score/100,1);
      arc.style.strokeDashoffset = 314*(1-pct);
    },100);
  }

  // Verdict card
  const pdfBtn = analysisId
    ? `<button class="btn-pdf" onclick="downloadPDF(${analysisId})"><svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>PDF</button>`
    : "";
  const vCard = document.createElement("div");
  vCard.className = `verdict-card ${isVeto?"veto":"favorable"}`;
  vCard.innerHTML = `
    <div class="verdict-header">
      <div class="verdict-title-group">
        <span class="verdict-icon">${isVeto?"🚨":"⚖"}</span>
        <div>
          <div class="verdict-title">${isVeto?"Veredito de Veto":"Veredito do Juiz IA"}</div>
          <div class="verdict-subtitle">Quantum Jurist — Deliberação Ponderada</div>
        </div>
      </div>
      ${pdfBtn}
    </div>
    <div class="verdict-divider"></div>
    <div class="verdict-text">${esc(verdict)}</div>`;
  out.appendChild(vCard);

  // Agent cards
  const agentsDone = results.filter(r=>r.type==="agent_done");
  if(agentsDone.length){
    const section = document.createElement("div");
    section.className="agents-section";
    section.innerHTML=`
      <div class="agents-header">
        <span class="section-title">Pareceres dos Especialistas</span>
        <span class="agents-count" style="font-family:var(--font-mono)">${agentsDone.length} / 16</span>
      </div>
      <div class="agents-grid" id="agents-grid"></div>`;
    out.appendChild(section);
    const grid = section.querySelector("#agents-grid");
    agentsDone.forEach((r,i)=>{
      const card = buildAgentCard(r,i);
      grid.appendChild(card);
    });
  }
}

function buildScoreCard(score, tribunal, agentCount){
  const div = document.createElement("div");
  div.className="score-panel";

  let label="Alto Risco Jurídico", chipClass="chip-red";
  if(score>=75){ label="Alta Probabilidade de Êxito"; chipClass="chip-green"; }
  else if(score>=50){ label="Viável com Ressalvas"; chipClass="chip-amber"; }

  // Arc color
  let arcColor="#2563eb";
  if(score>=75) arcColor="#10b981";
  else if(score>=50) arcColor="#f59e0b";
  else arcColor="#ef4444";

  div.innerHTML=`
    <div class="score-ring-wrap">
      <svg class="score-svg" viewBox="0 0 120 120">
        <circle class="score-track" cx="60" cy="60" r="50"/>
        <circle class="score-arc" cx="60" cy="60" r="50" stroke="${arcColor}" style="stroke-dashoffset:314;"/>
      </svg>
      <div class="score-center">
        <div class="score-num">${Math.round(score)}</div>
        <div class="score-label-ring">Score</div>
      </div>
    </div>
    <div class="score-meta">
      <div class="score-meta-title">Jusaii Score</div>
      <div class="score-chips">
        <span class="chip ${chipClass}">${label}</span>
        ${tribunal?`<span class="chip chip-blue">${tribunal}</span>`:""}
        <span class="chip chip-muted">${agentCount} especialistas</span>
      </div>
      <div class="score-desc">Score calculado com base na confiança ponderada dos 16 agentes, contraditório do Advogado do Diabo e completude da análise.</div>
    </div>`;
  return div;
}

function buildAgentCard(r, i){
  const card = document.createElement("div");
  card.className="agent-card";
  card.style.setProperty("--i", i);

  const risk = r.risk_level||"MÉDIO";
  const conf = r.confidence||0;

  card.innerHTML=`
    <div class="agent-summary" onclick="toggleAgent(this)">
      <span class="agent-num">${String(i+1).padStart(2,"0")}</span>
      <span class="agent-name">${esc(r.area||"")}</span>
      ${conf>0?`<span class="agent-conf"><span class="conf-val">${conf}%</span></span>`:""}
      <span class="risk-pill risk-${risk}">${risk}</span>
      <span class="agent-chevron">▾</span>
    </div>
    <div class="agent-body">
      ${r.specialty?`<div class="agent-specialty">${esc(r.specialty)}</div>`:""}
      ${r.top_risk?`<div class="agent-risk-detail">⚠ ${esc(r.top_risk)}</div>`:""}
      <div class="agent-analysis">${esc(r.analysis||"")}</div>
      ${r.duration_ms?`<div class="agent-duration">${r.duration_ms}ms</div>`:""}
    </div>`;

  if(i===0) card.classList.add("open");
  return card;
}

function toggleAgent(summary){
  const card = summary.closest(".agent-card");
  card.classList.toggle("open");
}

/* ──────────────────────────────────────────────
   PDF
────────────────────────────────────────────── */
async function downloadPDF(id){
  if(!token){ alert("Faça login para baixar o PDF."); return; }
  try{
    const res=await fetch(API+`/api/report/pdf/${id}`,{
      headers:{Authorization:`Bearer ${token}`},
      signal:AbortSignal.timeout(30000)
    });
    if(!res.ok){ alert("Erro ao baixar PDF."); return; }
    const blob=await res.blob();
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=`jusaii_${id}.pdf`;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  }catch{ alert("Erro ao baixar PDF."); }
}

    }
    out.innerHTML=`<div class="section-title" style="margin-bottom:20px;display:block;">📋 Seus Relatórios</div>`;
    data.forEach(r=>{
      const card=document.createElement("div");
      card.className="agent-card fade-up";
      card.style.marginBottom="10px";
      card.innerHTML=`
        <div class="agent-summary" style="cursor:default;">
          <span class="agent-name" style="flex:1">${esc(r.prompt)}</span>

    });
  }catch{ out.innerHTML=`<div class="loader-card"><div class="loader-text" style="color:#fca5a5;">Erro ao carregar histórico.</div></div>`; }
}

function showLogin(){

  setTimeout(()=>document.getElementById("login-email").focus(),150);
}
function showRegister(){
  closeModals();
  document.getElementById("modal-register").classList.add("active");
  setTimeout(()=>document.getElementById("reg-email").focus(),150);
}
function closeModals(){
  document.querySelectorAll(".modal-overlay").forEach(m=>m.classList.remove("active"));
}
document.querySelectorAll(".modal-overlay").forEach(m=>{
  m.addEventListener("click",e=>{ if(e.target===m) closeModals(); });
});
document.getElementById("login-pw").addEventListener("keydown",e=>{ if(e.key==="Enter") login(); });
document.getElementById("reg-pw").addEventListener("keydown",e=>{ if(e.key==="Enter") register(); });

/* ──────────────────────────────────────────────
   UTILS
────────────────────────────────────────────── */
function esc(s){
  if(!s) return "";
  return String(s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/\n/g,"<br>");
}
function showModalErr(el, msg){
  el.textContent=msg;
  el.style.display="block";
}
